<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" fill="none">
  <!-- SIMKUR Logo Emblem - White/Navy for Dark Sidebar -->
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="logoWhiteEmblemGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#EAF4FF"/>
      </linearGradient>
      <linearGradient id="logoWhiteSparkGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#1F9D68"/>
        <stop offset="100%" stop-color="#157B50"/>
      </linearGradient>
      <filter id="logoWhiteShadow" x="-2" y="-2" width="60" height="60" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B2540" flood-opacity="0.3"/>
      </filter>
    </defs>

    <!-- Outer Rounded Container -->
    <rect width="56" height="56" rx="16" fill="url(#logoWhiteEmblemGrad)" filter="url(#logoWhiteShadow)"/>
    <rect x="0.75" y="0.75" width="54.5" height="54.5" rx="15.25" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Curriculum Book Silhouette in Navy -->
    <path d="M14 38C19 36 24 36.5 28 39C32 36.5 37 36 42 38V21C37 19.5 32 20 28 22.5C24 20 19 19.5 14 21V38Z" fill="#123B66"/>
    <path d="M28 22.5V39" stroke="#EAF4FF" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Tech/Gear Accent in Simkur Blue -->
    <path d="M28 13L31 16H35L36 20L40 22L39 26L41 29L38 32H35L33 35L29 34L28 36L27 34L23 35L21 32H18L15 29L17 26L16 22L20 20L21 16H25L28 13Z" fill="#2563A6" fill-opacity="0.45"/>
    
    <!-- Precision Checkmark in Success Green -->
    <circle cx="39" cy="17" r="4.5" fill="url(#logoWhiteSparkGrad)"/>
    <path d="M37.5 17L38.8 18.2L40.8 15.8" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Text -->
  <g transform="translate(70, 15)">
    <!-- Wordmark in Pure White -->
    <text x="0" y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      SIMKUR<tspan fill="#6EE7B7">.</tspan>
    </text>
    <!-- Subtitle (Design Specification Section 1 & 3) -->
    <text x="0" y="37" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#BCD9F8" letter-spacing="1.2" text-transform="uppercase">
      PORTAL KURIKULUM SEKOLAH
    </text>
  </g>
</svg>
