<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- SIMKUR Logo Emblem - Jobie White Theme for Purple Sidebar -->
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="logoWhiteEmblemGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#EDE7FF"/>
      </linearGradient>
      <linearGradient id="logoWhiteSparkGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#20C985"/>
        <stop offset="100%" stop-color="#10B981"/>
      </linearGradient>
      <filter id="logoWhiteShadow" x="-2" y="-2" width="60" height="60" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e0b52" flood-opacity="0.25"/>
      </filter>
    </defs>

    <!-- Outer Rounded Container -->
    <rect width="56" height="56" rx="16" fill="url(#logoWhiteEmblemGrad)" filter="url(#logoWhiteShadow)"/>
    <rect x="0.75" y="0.75" width="54.5" height="54.5" rx="15.25" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Open Book Pages (Curriculum) in Purple -->
    <path d="M14 38C19 36 24 36.5 28 39C32 36.5 37 36 42 38V21C37 19.5 32 20 28 22.5C24 20 19 19.5 14 21V38Z" fill="#4B22B8"/>
    <path d="M28 22.5V39" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Dynamic Tech Gear in Lavender -->
    <path d="M28 13L31 16H35L36 20L40 22L39 26L41 29L38 32H35L33 35L29 34L28 36L27 34L23 35L21 32H18L15 29L17 26L16 22L20 20L21 16H25L28 13Z" fill="#5135D8" fill-opacity="0.35"/>
    
    <!-- Precision Checkmark in Vibrant Green -->
    <circle cx="39" cy="17" r="5" fill="url(#logoWhiteSparkGrad)"/>
    <path d="M37.5 17L38.8 18.2L40.8 15.8" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography Text -->
  <g transform="translate(70, 16)">
    <!-- Wordmark in Pure White -->
    <text x="0" y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      SIMKUR<tspan fill="#20C985">.</tspan>
    </text>
    <!-- Subtitle / Badge -->
    <text x="0" y="36" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#DDD2FC" letter-spacing="1.2" text-transform="uppercase">
      SISTEM KURIKULUM SMK
    </text>
  </g>
</svg>
